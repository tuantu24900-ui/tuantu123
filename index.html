    :root {

      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --accent: #0d9488;
      --accent-soft: #f0fdfa;
      --warn: #d97706;

    body.dark {

      --surface: #111827;
      --surface-alt: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;

      --primary-soft: rgba(59, 130, 246, 0.14);

      --accent-soft: rgba(45, 212, 191, 0.12);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.12);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background 0.25s, color 0.25s;
    }
    header {
      position: sticky; top: 0; z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none;
      cursor: pointer;
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);

    .btn-primary:hover { opacity: 0.92; color: #fff; }
    main { max-width: 980px; margin: 0 auto; padding: 28px 20px 64px; }
    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;

    .hero p { color: var(--text-muted); font-size: 0.98rem; }

      margin-top: 18px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .search-bar input {
      flex: 1; min-width: 240px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 0.95rem;

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; justify-content: space-between;

    h2.sec-title { font-size: 1.18rem; margin: 22px 0 10px; color: var(--text); }
    .callout {
      background: var(--primary-soft); border-left: 4px solid var(--primary);
      padding: 12px 16px; border-radius: 0 10px 10px 0; margin-bottom: 14px; font-size: 0.94rem;

    .callout.example { background: var(--warn-soft); border-left-color: var(--warn); }

    table { width: 100%; border-collapse: collapse; margin: 14px 0 18px; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 10px 12px; text-align: left; }
    th { background: var(--surface-alt); font-weight: 700; }
    .tool-section {

    .tool-section h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .tool-desc { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 10px; }
    textarea {
      width: 100%; min-height: 110px; padding: 12px;
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface-alt); color: var(--text);
      font-family: inherit; font-size: 0.92rem; resize: vertical;

    let isDark = localStorage.getItem("ai_lib_dark") === "1";
    if (isDark) document.body.classList.add("dark");

    function toggleTheme() {
      isDark = !isDark;
      document.body.classList.toggle("dark", isDark);
      localStorage.setItem("ai_lib_dark", isDark ? "1" : "0");
    }

    function getNotes(id) {
      return localStorage.getItem(`ai_lib_note_${id}`) || "";
    }

    function saveNotes(id, val) {
      localStorage.setItem(`ai_lib_note_${id}`, val);
      const counter = document.getElementById("charCount");
      if (counter) counter.textContent = `${val.length}/3000 ký tự`;
    }

    function clearNotes(id) {
      localStorage.removeItem(`ai_lib_note_${id}`);
      const ta = document.getElementById("noteArea");
      if (ta) {
        ta.value = "";
        saveNotes(id, "");
      }
    }

    function getLinks(id) {
      try {
        return JSON.parse(localStorage.getItem(`ai_lib_links_${id}`) || "[]");
      } catch {
        return [];
      }
    }

    function addLink(id) {
      const typeEl = document.getElementById("linkType");
      const urlEl = document.getElementById("linkUrl");
      const url = urlEl.value.trim();
      if (!url) return;
      const links = getLinks(id);
      links.push({ type: typeEl.value, url });
      localStorage.setItem(`ai_lib_links_${id}`, JSON.stringify(links));
      urlEl.value = "";
      renderLinks(id);
    }

    function removeLink(id, idx) {
      const links = getLinks(id);
      links.splice(idx, 1);
      localStorage.setItem(`ai_lib_links_${id}`, JSON.stringify(links));
      renderLinks(id);
    }

    function renderLinks(id) {
      const container = document.getElementById("linkList");
      if (!container) return;
      const links = getLinks(id);
      if (links.length === 0) {
        container.innerHTML = `<div style="font-size:0.84rem;color:var(--text-muted)">Chưa có link tham khảo cá nhân nào cho chương này.</div>`;
        return;
      }
      container.innerHTML = links.map((l, i) => `
        <div class="link-item">
          <div>
            <strong>${l.type === "video" ? "🎬 Video" : "🌐 Web"}:</strong>
            <a href="${l.url}" target="_blank" rel="noopener">${l.url}</a>
          </div>
          <button class="btn" style="padding:3px 9px;font-size:0.78rem" onclick="removeLink(${id}, ${i})">Xóa</button>
        </div>
      `).join("");
    }

          <div class="search-bar">
            <input type="text" id="searchInput" value="${filter}" placeholder="🔍 Tìm kiếm chương, khái niệm (VD: IPOS, Docker, Prompt, CIA...)" oninput="renderHome(this.value)" />

        </section>
        <section class="grid">

              </div>
              <a class="btn btn-primary" style="justify-content:center" href="#chuong-${c.id}">Vào học bài này →</a>
            </article>
          `).join("")}
        </section>
      `;
      const input = document.getElementById("searchInput");
      if (input && filter) {
        input.focus();
        input.setSelectionRange(filter.length, filter.length);
      }
    }

    function renderChapter(id) {
      const c = CHAPTERS.find(item => item.id === id) || CHAPTERS[0];
      const prevBtn = c.id > 1
        ? `<a class="btn" href="#chuong-${c.id - 1}">← Chương ${c.id - 1}</a>`
        : `<span class="btn" style="opacity:0.45;pointer-events:none">← Đầu khóa học</span>`;
      const nextBtn = c.id < CHAPTERS.length
        ? `<a class="btn" href="#chuong-${c.id + 1}">Chương ${c.id + 1} →</a>`
        : `<span class="btn" style="opacity:0.45;pointer-events:none">Hoàn thành 8 chương ✓</span>`;

      const noteVal = getNotes(c.id);

      document.getElementById("app").innerHTML = `
        <article class="slide-box">
          <div class="slide-meta">CHƯƠNG / SLIDE ${c.code}</div>
          <h1 class="slide-title">${c.title}</h1>
          <p class="slide-lead">${c.desc}</p>

          <div class="diagram-grid">
            ${c.diagram.map(d => `
              <div class="diag-item">
                <div class="diag-icon">${d.icon}</div>
                <div class="diag-title">${d.title}</div>
                <div class="diag-sub">${d.sub}</div>
              </div>
            `).join("")}
          </div>
          <div class="caption">${c.caption}</div>

          <h2 class="sec-title">${c.sec1Title}</h2>
          <div class="callout"><strong>💡 Hiểu nhanh:</strong> ${c.sec1Quick}</div>
          <ul class="clean">
            ${c.sec1Bullets.map(b => `<li>${b}</li>`).join("")}
          </ul>

          <h2 class="sec-title">${c.sec2Title}</h2>
          <div class="callout"><strong>💡 Hiểu nhanh:</strong> ${c.sec2Quick}</div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>${c.tableHeaders.map(h => `<th>${h}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${c.tableRows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")}
              </tbody>
            </table>
          </div>

          <div class="callout tip"><strong>💡 Mẹo nhớ:</strong> ${c.tip}</div>

          <div class="callout example">
            <strong>🎓 Ví dụ thực tế cho sinh viên</strong>
            <ul class="clean" style="margin-top:6px;margin-bottom:0">
              ${c.examples.map(ex => `<li>${ex}</li>`).join("")}
            </ul>
          </div>

          <div class="tool-section">
            <h3>📝 Ghi chú của tôi về slide này</h3>
            <p class="tool-desc">Ghi lại ý chính bạn rút ra hoặc câu hỏi cần hỏi giảng viên. Ghi chú tự động lưu trong trình duyệt của bạn.</p>
            <textarea id="noteArea" maxlength="3000" placeholder="Nhập ghi chú cá nhân cho Chương ${c.id}..." oninput="saveNotes(${c.id}, this.value)">${noteVal}</textarea>
            <div class="note-bar">
              <span id="charCount">${noteVal.length}/3000 ký tự</span>
              <button class="btn" onclick="clearNotes(${c.id})">Xóa ghi chú</button>
            </div>
          </div>

          <div class="tool-section">
            <h3>🔗 Link tham khảo của chương này</h3>
            <p class="tool-desc">Dán thêm link video (YouTube…) hoặc trang web liên quan để tra cứu nhanh; link được lưu ngay trong trình duyệt.</p>
            <div class="link-form">
              <select id="linkType">
                <option value="video">🎬 Video</option>
                <option value="web">🌐 Web</option>
              </select>
              <input type="url" id="linkUrl" placeholder="https://..." />
              <button class="btn btn-primary" onclick="addLink(${c.id})">Thêm</button>
            </div>
            <div class="link-list" id="linkList"></div>
          </div>

          <div class="nav-footer">
            ${prevBtn}
            <a class="btn" href="#trang-chu">🏠 Trang chủ</a>
            ${nextBtn}
          </div>
        </article>
      `;
      renderLinks(c.id);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function router() {
      const hash = window.location.hash || "#trang-chu";
      const match = hash.match(/^#chuong-(\d+)$/);
      if (match) {
        renderChapter(parseInt(match[1], 10));
      } else {
        renderHome();
      }
    }

    window.addEventListener("hashchange", router);
    router();
  </script>
</body>
</html>
